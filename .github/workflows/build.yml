name: Build VirtualCam Companion

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v2.0.1)'
        required: true
        default: 'v2.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyvirtualcam opencv-python Pillow pyinstaller

      - name: Extract OBS Virtual Camera driver
        run: powershell -ExecutionPolicy Bypass -File scripts/extract_obs_vcam.ps1

      - name: Set version in setup.iss
        shell: powershell
        run: |
          # 获取版本号：手动触发用 inputs.version，tag 触发用 tag 名
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          Write-Host "Version: $version"
          
          # 替换 setup.iss 中的版本号
          $content = Get-Content setup.iss -Raw
          $content = $content -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
          Set-Content setup.iss -Value $content
          
          Write-Host "setup.iss updated:"
          Select-String -Path setup.iss -Pattern "MyAppVersion"

      - name: Build exe with PyInstaller
        shell: cmd
        run: |
          pyinstaller ^
            --onefile ^
            --windowed ^
            --name "VirtualCamCompanion" ^
            --icon "app.ico" ^
            --distpath "dist" ^
            --workpath "build" ^
            --specpath "." ^
            --hidden-import "utils" ^
            --hidden-import "config" ^
            --hidden-import "cam_manager" ^
            --hidden-import "api_server" ^
            --hidden-import "gui" ^
            app.py

      - name: Compile Installer (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y
          iscc setup.iss /Oinstaller

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamCompanion-Setup
          path: installer/VirtualCamCompanion-Setup.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/VirtualCamCompanion-Setup.exe
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
